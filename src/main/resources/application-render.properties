# Render Standalone Profile (Zero External DB Required)
spring.application.name=blog
server.port=${PORT:8080}

# H2 File Database (Persisted inside container or in-memory)
spring.datasource.url=jdbc:h2:mem:blog_render_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console for debugging if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:RenderDefaultSecretKeyForJwtTokenGeneration987654321}
jwt.expiration=86400000

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
